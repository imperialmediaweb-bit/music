name: Build & Release LUTH

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/luth-software-*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller LUTH.spec --noconfirm

      - name: Download FFmpeg for bundling
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Path dist\LUTH\bin -Force
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe dist\LUTH\bin\
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe dist\LUTH\bin\

      - name: Install Playwright Chromium into build
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\dist\LUTH\_internal\playwright\driver\package\.local-browsers"
          python -m playwright install chromium

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Path dist\LUTH\output -Force
          New-Item -ItemType Directory -Path dist\LUTH\input -Force
          New-Item -ItemType Directory -Path dist\LUTH\cookies -Force

      - name: Copy .env.example
        run: copy .env.example dist\LUTH\.env.example

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\LUTH\* -DestinationPath dist\LUTH-windows.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTH-windows-zip
          path: dist/LUTH-windows.zip

      # Create/update a "latest" pre-release on every branch push
      - name: Update latest pre-release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LUTH Latest Build"
          prerelease: true
          files: dist/LUTH-windows.zip
          body: |
            ## LUTH — Latest automatic build

            Built from `${{ github.ref_name }}` @ ${{ github.sha }}

            **How to update:**
            1. Download `LUTH-windows.zip` below
            2. Close LUTH if running
            3. Extract ZIP over your LUTH folder (replace all)
            4. Reopen LUTH

      # Create formal release on version tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LUTH-windows.zip
          generate_release_notes: true
          body: |
            ## LUTH ${{ github.ref_name }}

            ### Download & Install
            1. Download `LUTH-windows.zip`
            2. Extract and run `LUTH.exe`

            ### First-time setup
            1. Go to **Settings** → enter your OpenAI API key
            2. Go to **Logins** → log into your music platform, YouTube, and TikTok
            3. Click **RUN PIPELINE** to generate your first track!
