name: Build & Release LUTH

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'claude/luth-software-*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller LUTH.spec --noconfirm

      - name: Download FFmpeg for bundling
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Path dist\LUTH\bin -Force
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe dist\LUTH\bin\
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe dist\LUTH\bin\

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Path dist\LUTH\output -Force
          New-Item -ItemType Directory -Path dist\LUTH\input -Force
          New-Item -ItemType Directory -Path dist\LUTH\cookies -Force

      - name: Copy .env.example
        run: copy .env.example dist\LUTH\.env.example

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\LUTH\* -DestinationPath dist\LUTH-windows.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTH-windows-zip
          path: dist/LUTH-windows.zip

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTH-windows-installer
          path: dist/LUTH_Setup_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LUTH-windows.zip
            dist/LUTH_Setup_*.exe
          generate_release_notes: true
          body: |
            ## LUTH ${{ github.ref_name }}

            ### Download & Install
            1. Download `LUTH_Setup_2.0.0.exe`
            2. Double-click → Next → Next → Install → Done!
            3. LUTH appears on your Desktop — just open it

            **Or** download `LUTH-windows.zip`, extract, and run `LUTH.exe` directly.

            ### First-time setup
            1. Go to **Settings** → enter your OpenAI API key
            2. Go to **Logins** → log into your music platform, YouTube, and TikTok
            3. Click **RUN PIPELINE** to generate your first track!
