name: Build & Release LUTH

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller LUTH.spec --noconfirm

      - name: Create output directories
        run: |
          mkdir dist\LUTH\output
          mkdir dist\LUTH\input
          mkdir dist\LUTH\cookies

      - name: Copy .env.example
        run: copy .env.example dist\LUTH\.env.example

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\LUTH\* -DestinationPath dist\LUTH-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTH-windows
          path: dist/LUTH-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LUTH-windows.zip
          generate_release_notes: true
          body: |
            ## LUTH ${{ github.ref_name }}

            ### Download & Install
            1. Download `LUTH-windows.zip`
            2. Extract to any folder
            3. Run `LUTH.exe`

            ### First-time setup
            After launching LUTH:
            1. Go to **Settings** and enter your OpenAI API key
            2. Install FFmpeg if not already installed (`winget install FFmpeg`)
            3. Install Playwright browsers: open a terminal in the LUTH folder and run `playwright install chromium`
            4. Go to **Logins** and log into YouTube, TikTok, and Music Factory
            5. Click **RUN PIPELINE** to generate your first track!
